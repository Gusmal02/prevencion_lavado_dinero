name: DevSecOps Compliance Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pld-security-and-testing:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio de forma segura
      uses: actions/checkout@v3

    - name: Configurar Entorno de Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Instalar dependencias de producción
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar Pruebas Unitarias Automatizadas
      run: |
        python test_pipeline.py

    # Bloque de seguridad opcional para análisis de código estático (SAST)
    - name: Escaneo de vulnerabilidades en el código (Bandit)
      run: |
        pip install bandit
        bandit -r modelo_machine_learning.py